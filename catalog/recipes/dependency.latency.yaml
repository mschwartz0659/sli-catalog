id: dependency.latency
category: latency
applies_to: [service, job]
source: convention
status: draft
summary: Minutes in which calls to one dependency stayed under the latency threshold, divided by all minutes.
good: A minute whose chosen percentile of slo.dependency.duration was at or under threshold_seconds.
valid: Every minute in the window.
params:
  dependency:
    required: true
    description: Name of the dependency, matching the dependency tag you emit.
    example: jira
  threshold_seconds:
    required: true
    description: Latency threshold in seconds.
    example: 2
  percentile:
    default: p95
    description: Which percentile to compare (p50, p75, p90, p95, p99).
default_mode: time_slice
modes:
  time_slice:
    queries:
      query1: "${percentile}:slo.dependency.duration{service:${service},env:${env},dependency:${dependency}}"
    formula: "query1"
    comparator: "<="
    threshold: "${threshold_seconds}"
    interval_seconds: 60
