id: datastore.latency
category: latency
applies_to: [datastore]
source: apm
status: draft
summary: Minutes in which database query latency, as seen by callers, stayed under the threshold, divided by all minutes.
good: A minute whose chosen percentile of database span duration was at or under threshold_seconds.
valid: Every minute in the window.
params:
  db_service:
    required: true
    description: The service name APM reports database spans under.
    example: incident-dashboard-postgres
  operation:
    required: true
    description: APM operation name for database spans.
    example: pg.query
  threshold_seconds:
    required: true
    description: Latency threshold in seconds.
    example: 0.05
  percentile:
    default: p95
    description: Which percentile to compare (p50, p75, p90, p95, p99).
default_mode: time_slice
modes:
  time_slice:
    queries:
      query1: "${percentile}:trace.${operation}{service:${db_service},env:${env}}"
    formula: "query1"
    comparator: "<="
    threshold: "${threshold_seconds}"
    interval_seconds: 60
