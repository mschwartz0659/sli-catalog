name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  catalog:
    name: Catalog, schema and validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Self-test (lint catalog, good fixtures pass, planted defects fail)
        run: python3 scripts/sli.py self-test
      - name: docs/catalog.md matches the recipes
        run: python3 scripts/sli.py catalog-doc --check
      - name: Template, examples and registry validate
        run: |
          shopt -s nullglob
          python3 scripts/sli.py validate templates/slo.yaml examples/*/slo.yaml registry/*/slo.yaml

  terraform:
    name: Terraform module
    needs: catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format
        run: terraform fmt -check -recursive
      - name: Module tests (mock provider, no credentials)
        working-directory: modules/datadog-slo
        run: |
          terraform init -backend=false -input=false
          terraform test
      - name: Registry root validates
        working-directory: registry
        run: |
          terraform init -backend=false -input=false
          terraform validate
